---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: calibre-web-automated
  namespace: calibre
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      # -- Version of the app-template helm chart
      # this example is not automatically updated, so be sure to use the latest chart version
      version: 2.2.0
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-helm-charts
        namespace: flux-system

  values:

    controllers:
      main:
        containers:
          main:
            image:
              repository: crocodilestick/calibre-web-automated
              tag: latest
              pullPolicy: IfNotPresent
            env:
              TZ: "America/New York"
              PUID: 1000
              PGID: 100
              DOCKER_MODS: lscr.io/linuxserver/mods:universal-calibre-v7.16.0

    strategy:
      type: Recreate

    # -- Configures service settings for the chart.
    service:
      main:
        ports:
          http:
            port: 8083

    # -- Configure persistence settings for the chart under this key.
    persistence:
      config:
        enabled: true
        globalMounts:
          - path: /config
        existingClaim: calibre-web-config-pvc
      books:
        type: nfs
        server: NFS.brendonmccool.com
        path: /k8s/calibre-taurus
        globalMounts:
          - path: /calibre-library
      ingest:
        type: nfs
        server: NFS.brendonmccool.com
        path: /k8s/calibre-ingest
        globalMounts:
          - path: /cwa-book-ingest
