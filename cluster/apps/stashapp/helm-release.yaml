---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: stash
  namespace: stash-ns
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      # -- Version of the app-template helm chart
      # this example is not automatically updated, so be sure to use the latest chart version
      version: 2.2.0
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-helm-charts
        namespace: flux-system

  values:

    controllers:
      main:
        containers:
          main:
            image:
              repository: stashapp/stash
              tag: latest
              pullPolicy: IfNotPresent
            env:
              STASH_STASH: /data/
              STASH_GENERATED: /meta/generated/
              STASH_METADATA: /meta/metadata/
              STASH_CACHE: /meta/cache/
              ## Adjust below to change default port (9999)
              STASH_PORT: 9999

    strategy:
      type: Recreate

    # -- Configures service settings for the chart.
    service:
      main:
        controller: main
        ports:
          http:
            port: 9999


    # -- Configure persistence settings for the chart under this key.
    persistence:
      data:
        type: nfs
        server: NFS.brendonmccool.com
        path: /brendon/stash/data
        globalMounts:
          - path: /data
      config:
        type: nfs
        server: NFS.brendonmccool.com
        path: /brendon/stash/config
        globalMounts:
          - path: /root/.stash
      metadata:
        enabled: true
        existingClaim: stash-pvc
        advancedMounts:
          main:
            main:
              - path: /meta
