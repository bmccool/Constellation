---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: navidrome
  namespace: navidrome-ns
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      # -- Version of the app-template helm chart
      # this example is not automatically updated, so be sure to use the latest chart version
      version: 2.2.0
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-helm-charts
        namespace: flux-system

  values:

    controllers:
      main:
        containers:
          main:
            image:
              repository: deluan/navidrome
              tag: latest
              pullPolicy: IfNotPresent
            env:
              TZ: "America/New York"

    strategy:
      type: Recreate

    # -- Configures service settings for the chart.
    service:
      main:
        controller: main
        ports:
          http:
            port: 4533


    # -- Configure persistence settings for the chart under this key.
    persistence:
      data:
        enabled: true
        existingClaim: navidrome-pvc
        advancedMounts:
          main:
            main:
              - path: /data
